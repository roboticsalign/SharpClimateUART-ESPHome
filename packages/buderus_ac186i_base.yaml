# ============================================
# Buderus Logacool AC186i Base Package
# ============================================
# This package contains the standard configuration for Buderus AC units
# Include this in your device YAML with: packages: { buderus_ac: !include packages/buderus_ac186i_base.yaml }
#
# Required substitutions in your main YAML:
#   - deviceid: Unique ID for the climate entity (e.g., "hvac1", "hvac2")
#   - ac_name: Display name for the AC unit (e.g., "Living Room AC", "Bedroom AC")
#
# Optional substitutions (with defaults):
#   - uart_tx_pin: "1" (GPIO for UART TX)
#   - uart_rx_pin: "3" (GPIO for UART RX)
#   - uart_baud: "4800" (UART baud rate)
#   - uart_parity: "NONE" (UART parity)
#   - uart_stop_bits: "1" (UART stop bits)

# External Component from GitHub
external_components:
  - source: github://sven819/SharpClimateUART-ESPHome
    refresh: 0s  # Use 'always' for development, '0s' for production

# Logger Configuration
logger:
  baud_rate: 0  # Disable serial logging when using TX/RX for UART
  level: ${log_level}

# UART Configuration for Buderus Logacool
uart:
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: ${uart_baud}
  parity: ${uart_parity}
  stop_bits: ${uart_stop_bits}

# Climate Entity
climate:
  - platform: sharp_ac
    id: ${deviceid}
    name: "${ac_name}"
    horizontal_vane_select:
      name: "${ac_name} Horizontal Vane"
    vertical_vane_select:
      name: "${ac_name} Vertical Vane"
    ion_switch:
      name: "${ac_name} Plasmacluster"
    connection_status:
      name: "${ac_name} Connection Status"
    reconnect_button:
      name: "${ac_name} Reconnect"
