# ============================================
# Example: ESP32-C3 with Buderus AC186i
# ============================================

substitutions:
  devicename: klimageraet-wohnzimmer
  deviceid: hvac1
  ac_name: "Wohnzimmer Klimaanlage"

  # UART Configuration for ESP32-C3
  uart_tx_pin: "1"
  uart_rx_pin: "3"

  # UART Parameters (optimized for Buderus AC186i)
  uart_baud: "4800"
  uart_parity: "NONE"
  uart_stop_bits: "1"

  # Logging
  log_level: "DEBUG"

esphome:
  name: ${devicename}
  friendly_name: ${devicename}

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: arduino

# Import Buderus AC package
packages:
  buderus_ac: !include ../packages/buderus_ac186i_base.yaml

# API Configuration
api:
  encryption:
    key: !secret api_key

# OTA Updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Fallback hotspot
  ap:
    ssid: "${devicename} Fallback"
    password: !secret ap_password

captive_portal:

# Web Server
web_server:
  port: 80
  version: 3

# Additional Features
button:
  - platform: restart
    name: "${devicename} Restart"

sensor:
  - platform: wifi_signal
    name: "${devicename} WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "${devicename} Uptime"
