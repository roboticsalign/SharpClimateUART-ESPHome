substitutions:
  nr: "2"
  devicename: esphome-buderus-buero
  deviceid: hvac${nr}

esphome:
  name: ${devicename}
  friendly_name: ${devicename}

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: arduino

external_components:
  - source: github://sven819/SharpClimateUART-ESPHome
    refresh: always

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  baud_rate: 0  # disable serial logging when using TX/RX for UART
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ".iot.int.dauer.de"

captive_portal:

web_server:
  port: 80
  version: 3

# UART Configuration for Buderus Logacool AC186i
uart:
  tx_pin: 1           # ESP32-C3: GPIO1 (hardware dependent)
  rx_pin: 3           # ESP32-C3: GPIO3 (hardware dependent)
  baud_rate: 4800     # FIXED: Was incorrectly indented!
  parity: NONE        # FIXED: Was incorrectly indented!
  stop_bits: 1        # FIXED: Was incorrectly indented!

button:
  - platform: restart
    name: "EG Buero Restart"

climate:
  - platform: sharp_ac
    id: ${deviceid}
    name: "EG Buero Klimaanlage"
    horizontal_vane_select:
      name: "EG Buero Horizontal Vane"
    vertical_vane_select:
      name: "EG Buero Vertikal Vane"
    ion_switch:
      name: "EG Buero Plasmacluster"
    connection_status:
      name: "EG Buero AC Connection Status"
    reconnect_button:
      name: "EG Buero AC Reconnect"
